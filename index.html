<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近现代国共将领交互式历史年表</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: {
      serif: ['"Noto Serif SC"', 'Georgia', 'STZhongsong', 'SimSun', 'serif'],
      sans: ['"Microsoft YaHei"', '"PingFang SC"', 'sans-serif']
    },
    colors: {
      ink:  { DEFAULT: '#1c1917', soft: '#44403c', faint: '#78716c' },
      kmt:  { DEFAULT: '#1d4ed8', deep: '#1e3a8a', soft: '#bfdbfe' },
      ccp:  { DEFAULT: '#b91c1c', deep: '#7f1d1d', soft: '#fecaca' },
      parchment: { DEFAULT: '#f5f1e8', dark: '#ebe4d5', card: '#fdfbf6' }
    }
  } }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }
  body { background:
      radial-gradient(circle at 15% 15%, rgba(120,90,40,.05), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(120,90,40,.05), transparent 40%),
      #f5f1e8;
  }
  .font-hei { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
  /* 轨迹条 */
  .track-row:hover .life-bar { filter: brightness(1.05) saturate(1.2); }
  .track-name { transition: color .15s, opacity .15s; letter-spacing: .02em; }
  .life-bar { transition: opacity .25s, filter .2s, box-shadow .2s; }
  .act-bar  { transition: opacity .25s; }
  .marker { transition: transform .13s, box-shadow .13s; z-index: 5; }
  .marker:hover { transform: translate(-50%,-50%) scale(1.55); z-index: 30; }
  .marker.hl { transform: translate(-50%,-50%) scale(1.7); box-shadow: 0 0 0 3px #fbbf24, 0 0 10px 3px rgba(251,191,36,.7); z-index: 40; }
  .dim { opacity: .14 !important; filter: grayscale(1); }
  .name-dim { opacity: .28 !important; }
  .life-bar.selected { box-shadow: 0 0 0 2px #f5f1e8, 0 0 0 4px #d97706; }
  /* 面板 */
  #panel { transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: 0 -12px 40px -8px rgba(60,40,10,.28); }
  #panel.hidden-panel { transform: translateY(101%); }
  .era-band { position:absolute; top:0; bottom:0; z-index:0; pointer-events:none; }
  .era-btn { transition: all .15s; }
  .era-btn.active { color:#fff; box-shadow: 0 2px 8px -1px rgba(0,0,0,.25); transform: translateY(-1px); }
  /* 模式切换 */
  .mode-btn { background:#fdfbf6; color:#78716c; }
  .mode-btn.active { background:linear-gradient(135deg,#b45309,#92400e); color:#fff; }
  .mode-btn:not(.active):hover { background:#fff; color:#44403c; }
  /* 档案 tab */
  .doc-tab { transition: all .15s; border-bottom:2px solid transparent; color:#78716c; }
  .doc-tab.active { color:#92400e; border-bottom-color:#b45309; font-weight:600; }
  .doc-tab:not(.active):hover { color:#44403c; }
  /* 成长轨迹时间线 */
  .journey-line::before { content:''; position:absolute; left:11px; top:6px; bottom:6px; width:2px; background:linear-gradient(#d6cbb3, #c4b696); }
  .jnode-dot { box-shadow: 0 0 0 3px #fdfbf6; }
  /* 卡片质感 */
  .card { background:#fdfbf6; border:1px solid #e3d9c4; box-shadow: 0 1px 3px rgba(60,40,10,.06), 0 6px 20px -8px rgba(60,40,10,.12); }
  .hairline { border-color:#e3d9c4; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background:#d6cbb3; border-radius: 6px; border:2px solid #f5f1e8; }
  ::-webkit-scrollbar-thumb:hover { background:#c4b696; }
  .chip { transition: all .12s; }
  .chip:hover { transform: translateY(-1px); }
</style>
</head>
<body class="text-ink h-screen flex flex-col overflow-hidden font-serif">

  <!-- 顶栏 -->
  <header class="relative bg-gradient-to-r from-stone-900 via-stone-800 to-stone-900 text-parchment px-5 py-3 flex items-center gap-5 shrink-0 border-b-2 border-amber-700/40">
    <div class="flex items-baseline gap-3">
      <h1 class="text-xl font-bold tracking-wide">国共将领历史年表</h1>
      <span class="text-[11px] text-amber-200/70 font-hei tracking-widest">1885 — 1950 · 交互式人物长卷</span>
    </div>
    <div class="flex items-center gap-4 text-xs font-hei ml-2">
      <span class="flex items-center gap-1.5"><span class="w-3.5 h-2 rounded-sm inline-block" style="background:#1d4ed8"></span>国民党</span>
      <span class="flex items-center gap-1.5"><span class="w-3.5 h-2 rounded-sm inline-block" style="background:#b91c1c"></span>共产党</span>
      <span class="flex items-center gap-1.5 text-amber-100/60"><span class="w-2.5 h-2.5 rounded-full inline-block bg-white border-2 border-stone-400"></span>战役</span>
      <span class="flex items-center gap-1.5 text-amber-100/60"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#f59e0b"></span>事件</span>
    </div>
    <div class="ml-auto flex items-center gap-2 font-hei">
      <input id="search" placeholder="搜索将领 / 战役…" class="bg-stone-700/60 border border-stone-600 text-parchment placeholder:text-stone-400 rounded-md px-3 py-1.5 text-sm w-52 focus:ring-2 focus:ring-amber-500/60 focus:bg-stone-700 outline-none transition">
      <button id="addBtn" class="bg-emerald-700 text-white text-sm px-3.5 py-1.5 rounded-md hover:bg-emerald-600 transition font-medium">＋ 新增将领</button>
      <button id="myBtn" class="text-sm px-3 py-1.5 rounded-md border border-stone-600 hover:bg-stone-700 transition">我的将领 <span id="myCount" class="text-amber-300">0</span></button>
      <button id="compareBtn" class="bg-amber-600 text-white text-sm px-3.5 py-1.5 rounded-md hover:bg-amber-500 disabled:opacity-40 disabled:cursor-not-allowed transition font-medium" disabled>对比交集 (0)</button>
      <button id="resetBtn" class="text-sm px-3 py-1.5 rounded-md border border-stone-600 hover:bg-stone-700 transition">重置</button>
    </div>
  </header>

  <!-- 模式切换 + 历史时期选择条 -->
  <div class="bg-parchment-dark/70 border-b hairline px-5 py-2 flex items-center gap-3 shrink-0 font-hei">
    <div id="mode-switch" class="flex items-center rounded-lg overflow-hidden border border-amber-700/40 shrink-0 shadow-sm">
      <button class="mode-btn text-xs px-3.5 py-1.5 font-medium transition" data-mode="timeline">🕓 时间轴模式</button>
      <button class="mode-btn text-xs px-3.5 py-1.5 font-medium transition" data-mode="war">⚔ 战争模式</button>
    </div>
    <div class="w-px h-5 bg-stone-300"></div>
    <!-- 时间轴模式：时期筛选 -->
    <div id="era-controls" class="flex items-center gap-3 flex-1 min-w-0">
      <span class="text-xs text-ink-faint shrink-0">历史时期</span>
      <div id="era-tabs" class="flex items-center gap-1.5 flex-wrap"></div>
      <span id="era-hint" class="text-xs text-ink-faint ml-1 italic truncate"></span>
    </div>
    <!-- 战争模式：战役选择 -->
    <div id="war-controls" class="hidden items-center gap-3 flex-1 min-w-0">
      <span class="text-xs text-ink-faint shrink-0">选择战役 / 事件</span>
      <select id="war-select" class="bg-parchment-card border border-amber-700/40 rounded-md px-3 py-1 text-sm text-ink focus:ring-2 focus:ring-amber-500/50 outline-none max-w-md"></select>
      <span id="war-hint" class="text-xs text-ink-faint italic truncate"></span>
    </div>
  </div>

  <div class="flex flex-1 min-h-0">
    <!-- 左侧筛选面板（仅时间轴模式） -->
    <aside id="side-filters" class="w-60 card border-y-0 border-l-0 overflow-y-auto shrink-0 text-sm font-hei">
      <div class="p-4 space-y-5" id="filters"></div>
    </aside>

    <!-- 中部主区 -->
    <main class="flex-1 flex flex-col min-w-0 bg-parchment">
      <!-- 时间轴视图 -->
      <div id="view-timeline" class="flex-1 flex flex-col min-h-0">
        <div class="px-4 py-2 border-b hairline text-xs text-ink-soft flex items-center gap-3 shrink-0 font-hei bg-parchment-card/60">
          <span id="count-hint">—</span>
          <span class="ml-auto text-ink-faint">点击轨迹条查看档案 · Shift+点击 多选对比</span>
        </div>
        <div id="timeline-scroll" class="flex-1 overflow-auto relative">
          <div id="axis" class="sticky top-0 z-20 h-8 bg-parchment-card/95 backdrop-blur border-b hairline"></div>
          <div id="tracks" class="relative"></div>
        </div>
      </div>
      <!-- 战争视图 -->
      <div id="view-war" class="hidden flex-1 overflow-auto p-5"></div>
    </main>
  </div>

  <!-- 底部侧滑面板 -->
  <section id="panel" class="hidden-panel fixed bottom-0 left-0 right-0 h-[70vh] bg-parchment-card border-t-2 border-amber-700/40 z-50 flex flex-col">
    <div class="flex items-center px-5 py-3 border-b hairline bg-gradient-to-r from-stone-100 to-parchment-dark shrink-0">
      <h2 id="panel-title" class="font-bold text-lg text-ink"></h2>
      <button id="panel-close" class="ml-auto w-8 h-8 flex items-center justify-center rounded-full text-ink-faint hover:bg-stone-200 hover:text-ink text-2xl leading-none transition">&times;</button>
    </div>
    <div id="panel-body" class="p-5 overflow-y-auto text-sm"></div>
  </section>

  <div id="tooltip" class="fixed hidden bg-stone-900/95 text-parchment text-xs rounded-lg px-3 py-2 z-[60] pointer-events-none max-w-xs shadow-xl font-hei leading-relaxed"></div>

  <!-- 模态框（新增将领 / 我的将领） -->
  <div id="modal-mask" class="hidden fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
    <div class="bg-parchment-card rounded-xl shadow-2xl w-full max-w-2xl max-h-[88vh] flex flex-col border border-amber-700/30">
      <div class="flex items-center px-5 py-3 border-b hairline bg-gradient-to-r from-stone-100 to-parchment-dark rounded-t-xl shrink-0">
        <h2 id="modal-title" class="font-bold text-lg text-ink font-serif">新增将领</h2>
        <button id="modal-close" class="ml-auto w-8 h-8 flex items-center justify-center rounded-full text-ink-faint hover:bg-stone-200 hover:text-ink text-2xl leading-none transition">&times;</button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto font-hei text-sm"></div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] px-4 py-2.5 rounded-lg text-sm font-hei shadow-xl"></div>

  <script src="data/generals.js"></script>
  <script src="data/battles.js"></script>
  <script src="data/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
